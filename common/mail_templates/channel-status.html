{{define "channel-status"}}{{template "email-open" .}}
<h1>{{.Subject}}</h1><p style="font-size:16px;font-weight:600">渠道状态更新 · Channel status update</p><p style="color:#64748b">请核对变更原因，以及其他渠道是否仍可正常承接请求。</p>
<div style="background:#eff6ff;border-radius:8px;padding:20px" class="message-body">{{.Body}}</div>
<p style="font-size:12px;color:#64748b;margin-top:24px">单个渠道状态变化不等同于全站故障，请结合实际调用与日志判断。</p>
{{template "email-close" .}}{{end}}
