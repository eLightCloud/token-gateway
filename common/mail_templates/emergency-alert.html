{{define "emergency-alert"}}{{template "email-open" .}}
<h1>{{.Subject}}</h1><p style="font-size:16px;font-weight:600">需要及时处理 · Action required</p><p style="color:#64748b">检测到运行异常，请根据下面的事件、节点与时间判断影响。</p>
<div role="alert" style="background:#fef2f2;border:1px solid #fecaca;padding:20px;border-radius:8px" class="message-body">{{.Body}}</div>
<p style="font-size:12px;color:#64748b;margin-top:24px">请优先检查受影响服务。此邮件只报告异常，不会自动更改业务配置。</p>
{{template "email-close" .}}{{end}}
