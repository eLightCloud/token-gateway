{{define "email-open"}}<!doctype html>
<html lang="{{or .Language "zh-CN"}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>{{.Subject}}</title>
<style>body{margin:0;background:#f1f5f9;color:#1e293b;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}p,li{font-size:14px;line-height:1.8}h1{font-size:24px;line-height:1.4;margin:12px 0 20px}h2{font-size:18px;line-height:1.5}a{color:#4338ca;overflow-wrap:anywhere}table{border-collapse:collapse;max-width:100%}td,th{font-size:14px;line-height:1.7;text-align:left;overflow-wrap:anywhere}pre,code{white-space:pre-wrap;overflow-wrap:anywhere}.message-body{overflow-wrap:anywhere}.message-body p:first-child{margin-top:0}.message-body table td,.message-body table th{padding:8px;border-bottom:1px solid #e2e8f0}@media(max-width:620px){.email-card{width:100%!important}.email-padding{padding:24px 18px!important}h1{font-size:21px!important}}</style></head>
<body data-email-template="{{.Kind}}" data-email-template-version="1"><div style="display:none;max-height:0;overflow:hidden;opacity:0">{{.Preview}}</div><table role="presentation" width="100%"><tr><td align="center" style="padding:24px 12px;text-align:center"><table role="presentation" width="600" class="email-card" style="width:600px;max-width:100%;background:#fff;border:1px solid #e2e8f0;border-top:5px solid {{.Accent}};border-radius:12px"><tr><td class="email-padding" style="padding:32px"><p style="font-size:12px;color:#64748b;margin:0 0 8px">{{.Brand}}</p><p style="font-size:12px;font-weight:700;color:{{.Accent}};margin:0">{{.Label}}</p>
{{end}}
{{define "email-close"}}</td></tr><tr><td class="email-padding" style="padding:20px 32px;border-top:1px solid #e2e8f0;background:#f8fafc"><p style="font-size:12px;color:#64748b;margin:0">{{or .Footer "系统自动发送，请勿直接回复。 / Automated message; please do not reply."}}</p><p style="font-size:11px;color:#94a3b8;margin:8px 0 0">{{or .PoweredBy "Powered by"}} new-api · QuantumNous</p></td></tr></table></td></tr></table></body></html>{{end}}
