{{define "quota-warning"}}{{template "email-open" .}}
<h1>{{.Subject}}</h1><p style="font-size:16px;font-weight:600">请关注可用额度 · Check available quota</p><p style="color:#64748b">当前账户或订阅触发了额度预警，请核对剩余额度。</p>
<div style="background:#fffbeb;border:1px solid #fde68a;padding:20px;border-radius:8px" class="message-body">{{.Body}}</div>
<p style="font-size:12px;color:#64748b;margin-top:24px">如您刚完成充值或额度已恢复，请以应用内最新余额为准。</p>
{{template "email-close" .}}{{end}}
