{{define "security-change"}}{{template "email-open" .}}
<h1>{{.Subject}}</h1><p style="font-size:16px;font-weight:600">核对安全变更 · Review security changes</p><p style="color:#64748b">账户安全设置发生了变化，请确认是否为本人操作。</p>
<div style="border-left:4px solid #9f1239;background:#fff1f2;padding:20px" class="message-body">{{.Body}}</div>
<p style="font-size:12px;color:#64748b;margin-top:24px">如发现非本人操作，请通过应用的安全设置检查会话并联系管理员。</p>
{{template "email-close" .}}{{end}}
