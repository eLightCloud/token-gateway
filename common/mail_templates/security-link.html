{{define "security-link"}}{{template "email-open" .}}
<h1>{{.Subject}}</h1>
<p style="font-size:16px;font-weight:600">{{.Heading}}</p>
<div style="background:#f8fafc;border:1px solid #cbd5e1;padding:24px;border-radius:8px" class="message-body">{{.Body}}</div>
<p style="font-size:12px;color:#64748b;margin-top:24px">{{.Warning}}</p>
{{template "email-close" .}}{{end}}
